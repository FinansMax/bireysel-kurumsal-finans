name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  # Bagimlilik taramasi (Issue #189).
  #
  # ESIK ONCE "critical" IDI: uc yuksek advisory (deepmerge-ts ve onu ceken @prisma/config +
  # prisma) production agacinda GORUNUYORDU, cunku @prisma/client 'prisma'yi peerDependency
  # olarak ilan eder ve --omit=dev zinciri kesmez. Olculmustu: bu paketler DEPLOY EDILEN KODA
  # ULASMIYORDU (prisma sadece CLI/migration yolunda), ama esigi 'high'a cekmenin gurultu
  # maliyeti henuz olculmemisti — bu yuzden esik gecici olarak 'critical'da tutulmustu.
  #
  # ESIK ARTIK "high" (Issue #227 kapanis karari): tek kok deepmerge-ts@7.1.5 icin
  # package.json'a 'overrides: {"deepmerge-ts": "^8.0.2"}' eklenince (Issue #227) 'npm audit'
  # sifir bulguya dustu. Gurultu maliyeti bu kez OLCULDU: 'npm audit --omit=dev
  # --audit-level=high' 0 bulgu veriyor. Yani esigi yukseltmenin CI'i kirma riski yoktu ve
  # esik 'high'a cekildi — artik kod yoluna GERCEKTEN ulasan bir high seviye acik da CI'i
  # kirar. Tam gerekce ve olcumun tekrarlanabilir komutlari:
  # README "Bagimlilik guvenligi (Issue #189)".
  #
  # TEK ADIM YETER, OLCULDU: --audit-level YALNIZCA CIKIS KODUNU degistirir, ciktiyi
  # degil.
  #
  # 'npm ci' BILEREK YOK: 'npm audit' package-lock.json'dan calisir, node_modules'a
  # ihtiyac duymaz (dogrulandi). Kurulum eklemek isi dakikalarca uzatir, taramaya hicbir
  # sey katmaz.
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # --omit=dev: gelistirme araclarindaki bir acik deploy edilen koda ulasmaz.
      - name: Bagimlilik taramasi (high ve uzeri CI'i kirar, Issue #227)
        run: npm audit --omit=dev --audit-level=high

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    env:
      # CI'a özgü, disposable bir değer (production secret değildir).
      AUTH_SECRET: "zUdI/d5lYRHI0X4VeuR1QdMfwwlAuKllpSVqERSON/c="
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Build
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    env:
      # CI'a özgü, disposable değerler (production DB/secret değildir).
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/bireysel_kurumsal_finans_test?schema=public"
      AUTH_SECRET: "zUdI/d5lYRHI0X4VeuR1QdMfwwlAuKllpSVqERSON/c="

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bireysel_kurumsal_finans_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Apply Prisma migrations
        run: npm run prisma:migrate:deploy

      - name: Run integration tests
        run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    env:
      # CI'a özgü, disposable değerler (production DB/secret değildir).
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/bireysel_kurumsal_finans_test?schema=public"
      AUTH_SECRET: "zUdI/d5lYRHI0X4VeuR1QdMfwwlAuKllpSVqERSON/c="

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bireysel_kurumsal_finans_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Apply Prisma migrations
        run: npm run prisma:migrate:deploy

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    env:
      # CI'a özgü, disposable değerler (production DB/secret değildir).
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/bireysel_kurumsal_finans_test?schema=public"
      AUTH_SECRET: "zUdI/d5lYRHI0X4VeuR1QdMfwwlAuKllpSVqERSON/c="

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bireysel_kurumsal_finans_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Apply Prisma migrations
        run: npm run prisma:migrate:deploy

      - name: Run security tests
        run: npm run test:security
